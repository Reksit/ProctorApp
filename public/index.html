<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - Secure Proctor Quiz</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card glass">
      <div class="auth-header">
        <h1 class="text-gradient">PROCTOR SHIELD</h1>
        <p>Secure Online Examination Portal</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-login">Login</button>
        <button type="button" class="auth-tab" id="tab-register">Sign Up</button>
      </div>

      <!-- Error / Success Alert Box -->
      <div id="alert-box" style="display:none; padding:0.8rem; border-radius:12px; margin-bottom:1.2rem; font-size:0.9rem; font-weight:500; text-align:center;"></div>

      <!-- Login Form -->
      <form class="auth-form active" id="form-login">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="input-control" placeholder="enter your registered email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <input type="password" id="login-password" class="input-control" placeholder="••••••••" required autocomplete="current-password" style="width: 100%; padding-right: 2.5rem;">
            <button type="button" class="toggle-password-btn" data-target="login-password" style="position: absolute; right: 0.75rem; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.2rem; display: flex; align-items: center; justify-content: center;" title="Toggle password visibility">
              <svg class="eye-icon-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-icon-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Sign In to Dashboard</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="form-register">
        <div class="form-group">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" class="input-control" placeholder="student_name_123" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="input-control" placeholder="name@domain.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <input type="password" id="reg-password" class="input-control" placeholder="minimum 6 characters" required autocomplete="new-password" minlength="6" style="width: 100%; padding-right: 2.5rem;">
            <button type="button" class="toggle-password-btn" data-target="reg-password" style="position: absolute; right: 0.75rem; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.2rem; display: flex; align-items: center; justify-content: center;" title="Toggle password visibility">
              <svg class="eye-icon-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-icon-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="reg-secret">Security Passcode (Optional)</label>
          <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <input type="password" id="reg-secret" class="input-control" placeholder="enter passcode if provided" style="width: 100%; padding-right: 2.5rem;">
            <button type="button" class="toggle-password-btn" data-target="reg-secret" style="position: absolute; right: 0.75rem; background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.2rem; display: flex; align-items: center; justify-content: center;" title="Toggle passcode visibility">
              <svg class="eye-icon-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="eye-icon-closed" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Create Account</button>
      </form>

      <p class="auth-footer-text">Protected by active tab & fullscreen monitoring</p>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
